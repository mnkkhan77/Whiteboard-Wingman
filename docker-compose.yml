# Local infrastructure for Whiteboard Wingman. From the repo root:
#
#   docker compose up -d                               # postgres + kafka (+ topics) + kafka-ui
#   docker compose --profile processor up -d --build   # ...plus the Python doc-processor
#
# The Spring Boot backend and the Vite frontend still run on the host (mvn spring-boot:run /
# npm run dev) and reach these on localhost. The Judge0 stack for Run Code is separate, see
# backend/judge0/docker-compose.yml.

# Fixed project name, so running compose from any checkout (e.g. a git worktree) reuses the same
# containers and volumes instead of starting a second stack that fights over the same host ports.
name: wingman

services:
  postgres:
    # Plain PostgreSQL 16 with the pgvector extension preinstalled — backs both the relational
    # schema and the RAG vector store (Flyway V14 runs CREATE EXTENSION vector).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: wingman
      POSTGRES_USER: wingman
      POSTGRES_PASSWORD: wingman
    # Published on host port 5433, not 5432: 5432 is very often already taken by a natively
    # installed PostgreSQL (it is on the main dev machine), and a clash there fails `up` outright
    # — or worse, points the backend at the wrong server. Override with POSTGRES_PORT=...; the
    # backend's DB_PORT (application.yml) defaults to the same 5433.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wingman -d wingman"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    # Single-node KRaft (no ZooKeeper): this one process is both broker and controller.
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners because a Kafka client connects to whatever address the broker
      # *advertises*, not the one it dialled: containers on the compose network use kafka:29092,
      # processes on the host (the Spring Boot backend) use localhost:9092.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # A single broker can't satisfy the default replication factor of 3 for internal topics.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    # No volume on purpose: broker data lives in the container layer, which survives
    # stop/start but not a `docker compose down`. Fine for local dev — kafka-init recreates the
    # topics, and a study pack stuck mid-pipeline can simply be re-uploaded.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-init:
    # One-shot: creates the study-pack pipeline topics (docs/study-packs-contract.md) and exits.
    # --if-not-exists makes it safe to re-run on every `docker compose up`.
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in wingman.document.uploaded wingman.document.parsed wingman.document.failed wingman.document.uploaded.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: wingman
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  doc-processor:
    # Behind a profile so a plain `docker compose up -d` works even before ./doc-processor exists
    # or has been built; opt in with --profile processor.
    profiles: ["processor"]
    build: ./doc-processor
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      STORAGE_ROOT: /data/uploads
    # Shared claim-check storage: the backend (on the host) writes uploads under
    # backend/data/uploads, the processor reads them and writes chunks.json back next to them.
    volumes:
      - ./backend/data/uploads:/data/uploads

volumes:
  postgres-data:
