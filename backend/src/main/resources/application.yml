spring:
  application:
    name: mock-interview-backend

  # Used only when nothing else says otherwise — a real -Dspring-boot.run.profiles=X,
  # SPRING_PROFILES_ACTIVE env var, or deploy-time config always overrides this. "dev" only turns
  # on dev conveniences (AdminSeeder) — every profile talks to the same PostgreSQL, started locally
  # with `docker compose up -d` from the repo root.
  profiles:
    default: dev

  # Defaults match the repo-root docker-compose.yml "postgres" service, which publishes on host
  # port 5433 (not 5432) to stay clear of a natively installed PostgreSQL — see the comment there.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:wingman}
    username: ${DB_USERNAME:wingman}
    password: ${DB_PASSWORD:wingman}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  ai:
    vectorstore:
      pgvector:
        # Flyway (V14) owns the vector_store table — PgVectorStore must not try to create or drop
        # it. schema-validation instead fails startup loudly if that table is missing.
        initialize-schema: false
        schema-validation: true
        # Must match both V14's vector(384) and the local all-MiniLM-L6-v2 transformers model.
        # Setting it explicitly also stops PgVectorStore from embedding a probe string at startup
        # just to discover the dimension.
        dimensions: 384
        index-type: HNSW
        distance-type: COSINE_DISTANCE
    openai:
      # Placeholder only — real per-user calls never use this bean, see PerRequestChatClientFactory.
      # Spring Boot autoconfiguration requires *some* value to be present even if unused at runtime.
      api-key: ${OPENAI_API_KEY:placeholder}

  autoconfigure:
    exclude:
      # Ingestion embeds via the local transformers model (no key needed, §3/§4 of PLAN.md) — without
      # this exclusion, the OpenAI starter also auto-configures an EmbeddingModel bean, and Spring
      # can't pick one unambiguously when the auto-configured PgVectorStore asks for a plain EmbeddingModel.
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration

  # Study Packs pipeline (docs/study-packs-contract.md). Inside the compose network use kafka:29092.
  # Values are plain JSON strings (StringSerializer/Deserializer): DocumentEventPublisher and
  # DocumentEventsListener do the Jackson (de)serialization, so no Java type headers hit the wire.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Bounds how long send() may block the upload request when the broker is unreachable.
        max.block.ms: 10000
    consumer:
      group-id: wingman-backend
      auto-offset-reset: earliest
      # Embedding runs on the listener thread (see DocumentEventsListener): one record per poll and
      # a 30-min poll interval so a slow CPU embedding of a big pack never triggers a rebalance.
      max-poll-records: 1
      properties:
        max.poll.interval.ms: 1800000
    listener:
      # Commit each offset only after its handler returned — at-least-once, handlers are idempotent.
      ack-mode: record

  # Pack chat streams its answer over SSE (an async request): long enough for a full ~800-token
  # answer, short enough that an abandoned stream is cancelled rather than held open indefinitely.
  mvc:
    async:
      request-timeout: 120s

  # Must be >= the largest tier's maxFileBytes (MAX = 200MB); the per-tier limit is enforced in
  # StudyPackService, and anything over this cap maps to 413 FILE_TOO_LARGE in GlobalExceptionHandler.
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 201MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-please}
  expiration-ms: 86400000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

interview:
  default-question-count: 8

# A local Judge0 container (judge0/docker-compose.yml) backs the Run Code feature.
judge0:
  base-url: ${JUDGE0_BASE_URL:http://localhost:2358}

app:
  # Disk cache so a restart doesn't silently wipe what /api/admin/ingest last generated for the MCQ
  # bank — see StaticQuestionBankService. (Ingested RAG chunks need no such cache any more: they
  # live in Postgres via pgvector.) Ingestion itself stays manual/admin-run.
  mcq-bank-cache-path: ${MCQ_BANK_CACHE_PATH:./data/mcq-bank-cache.json}

  # Study Packs — shared with the doc-processor (its STORAGE_ROOT; docker-compose mounts this dir).
  # Override with the APP_STORAGE_ROOT env var (Spring relaxed binding).
  storage:
    root: ./data/uploads

  kafka:
    topics:
      uploaded: wingman.document.uploaded
      parsed: wingman.document.parsed
      failed: wingman.document.failed

  # Per-tier Study Pack limits (docs/study-packs-contract.md "Tiers"); served to the frontend via
  # GET /api/packs/limits. max-packs -1 = unlimited. File sizes in bytes (10/50/200 MB).
  tiers:
    free:
      max-file-bytes: 10485760
      max-pages: 50
      max-packs: 3
      max-chunks-per-pack: 300
      ocr-enabled: false
      allowed-extensions: [pdf]
      chat-tokens-per-month: 20000
    pro:
      max-file-bytes: 52428800
      max-pages: 300
      max-packs: 20
      max-chunks-per-pack: 2000
      ocr-enabled: true
      allowed-extensions: [pdf, docx]
      chat-tokens-per-month: 500000
    max:
      max-file-bytes: 209715200
      max-pages: 1000
      max-packs: -1
      max-chunks-per-pack: 6000
      ocr-enabled: true
      allowed-extensions: [pdf, docx, pptx, png, jpg, jpeg]
      chat-tokens-per-month: 2000000

  # "Chat with a pack" and "Quiz from a pack" (docs/study-packs-contract.md). Unlike every other LLM
  # feature these use ONE server-side key (never the user's own). Leave GROQ_API_KEY empty to turn
  # them off: they then answer 503 CHAT_UNAVAILABLE, the rest of the app is unaffected.
  llm:
    server:
      api-key: ${GROQ_API_KEY:}
      provider: GROQ
      model: openai/gpt-oss-20b
      # max_completion_tokens; gpt-oss spends part of it on hidden reasoning, hence effort "low".
      max-output-tokens: 800
      # Non-streaming JSON calls (quiz generation batches of up to 8 questions, grading, report
      # narrative) need more room than one chat answer.
      structured-max-output-tokens: 4096
      temperature: 0.2
      reasoning-effort: low

  chat:
    top-k: 6
    # Minimum cosine similarity (all-MiniLM-L6-v2) for a chunk to be a source — see ChatProperties.
    # Calibrated on a 6-chunk textbook chapter (PackRetrievalServiceIntegrationTest): answerable
    # questions scored 0.41-0.75 on their best chunk, off-topic ones (baking, capital of France,
    # Kubernetes, binary trees, photosynthesis, jokes) at most 0.24. 0.3 sits in that gap. Vague
    # meta-questions ("summarize chapter 2", ~0.21) also fall below it and get the no-context reply.
    similarity-threshold: 0.3
    # Previous question/answer pairs sent along for follow-up questions.
    history-turns: 3
    max-message-chars: 2000

  # Question-bank generation for "quiz from a pack" — see QuizProperties. 12 chunks spread across the
  # document, 4 sequential LLM calls of 3 chunks / 6 questions each, 24 questions in total.
  quiz:
    target-questions: 24
    min-questions: 2
    max-batches: 4
    chunks-per-batch: 3
    max-questions-per-batch: 8
    rate-limit-retries: 2
    rate-limit-backoff: 20s
    generation-threads: 2
    queue-capacity: 20
    # Grading / report narrative of a pack quiz: one short retry of a 429, a user request is waiting.
    session-rate-limit-retries: 1
    session-rate-limit-backoff: 5s
