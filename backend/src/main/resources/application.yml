spring:
  application:
    name: mock-interview-backend

  # Used only when nothing else says otherwise — a real -Dspring-boot.run.profiles=X,
  # SPRING_PROFILES_ACTIVE env var, or deploy-time config always overrides this. Makes
  # `mvn spring-boot:run` with zero flags "just work" against the file-based H2 dev DB.
  profiles:
    default: dev

  datasource:
    url: jdbc:mysql://localhost:3306/mock_interview?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # MySQL has no CLOB keyword — @Lob String fields map to LONGTEXT under MySQLDialect.
  flyway:
    placeholders:
      clob_type: LONGTEXT

  ai:
    openai:
      # Placeholder only — real per-user calls never use this bean, see PerRequestChatClientFactory.
      # Spring Boot autoconfiguration requires *some* value to be present even if unused at runtime.
      api-key: ${OPENAI_API_KEY:placeholder}

  autoconfigure:
    exclude:
      # Ingestion embeds via the local transformers model (no key needed, §3/§4 of PLAN.md) — without
      # this exclusion, the OpenAI starter also auto-configures an EmbeddingModel bean, and Spring
      # can't pick one unambiguously when our VectorStore bean asks for a plain EmbeddingModel.
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-please}
  expiration-ms: 86400000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

interview:
  default-question-count: 8

# A local Judge0 container (judge0/docker-compose.yml) backs the Run Code feature.
judge0:
  base-url: ${JUDGE0_BASE_URL:http://localhost:2358}
