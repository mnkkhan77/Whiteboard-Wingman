# Local dev profile — the default when nothing else is set (spring.profiles.default in
# application.yml). Nothing database-specific lives here any more: dev uses the same PostgreSQL +
# pgvector as every other profile (repo-root docker-compose.yml), and data survives restarts
# because it lives in the compose "postgres" named volume.
#
# The profile itself still matters: AdminSeeder (@Profile("dev")) only runs under it, promoting
# APP_SEED_ADMIN_EMAIL to ADMIN on startup. Add genuinely dev-only overrides below as needed.
